<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Map Element Metadata Editor</title>
    <link rel="stylesheet" href="/static/styles.css?v=0.16.0" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Map Element Metadata Editor</h1>
        <p>Set element footprints, walkable squares, and edge exits.</p>
      </div>
      <a class="link-button" href="/">Home Screen</a>
    </header>

    <main class="shell editor-shell">
      <section class="panel editor-browser">
        <div class="panel-heading">
          <h2>Map Elements</h2>
          <span id="editor-status" class="status">Loading</span>
        </div>
        <div id="tile-list" class="tile-list"></div>
      </section>

      <section class="panel editor-detail">
        <div class="panel-heading">
          <h2 id="tile-title">Select an element</h2>
        </div>

        <div class="tile-editor-grid">
          <form id="tile-form" class="stack">
            <label>
              Name
              <input id="edit-name" type="text" />
            </label>
            <label>
              Description
              <textarea id="edit-description" rows="4"></textarea>
            </label>
            <div class="form-row metadata-row">
              <label>
                Room Type
                <select id="edit-type">
                  <option value="unknown">Unknown</option>
                  <option value="room">Room</option>
                  <option value="corridor">Corridor</option>
                </select>
              </label>
              <label class="wide-field">
                Validation Status
                <select id="edit-status" title="Metadata only; does not affect gameplay."></select>
              </label>
            </div>
          </form>
        </div>

        <div class="panel-subsection">
          <div class="panel-heading editor-overlay-heading">
            <h2>Grid Overlay</h2>
            <div class="overlay-controls">
              <div class="overlay-control-group">
                <label class="compact-field">
                  Width
                  <input id="edit-width" type="number" min="1" max="20" />
                </label>
                <label class="compact-field">
                  Height
                  <input id="edit-height" type="number" min="1" max="20" />
                </label>
                <label class="compact-field">
                  Cell
                  <input id="edit-cell-size" type="number" min="24" max="180" />
                </label>
                <label class="compact-field">
                  Scale %
                  <input id="edit-image-scale" type="number" min="10" max="2000" step="5" />
                </label>
                <label class="compact-field">
                  X Offset
                  <input id="edit-image-offset-x" type="number" min="-1000" max="1000" />
                </label>
                <label class="compact-field">
                  Y Offset
                  <input id="edit-image-offset-y" type="number" min="-1000" max="1000" />
                </label>
                <div class="nudge-pad" aria-label="Image offset controls">
                  <button type="button" class="nudge-button up" data-offset-action="y-decrease" aria-label="Move image up"></button>
                  <button type="button" class="nudge-button left" data-offset-action="x-decrease" aria-label="Move image left"></button>
                  <span class="nudge-center" aria-hidden="true"></span>
                  <button type="button" class="nudge-button right" data-offset-action="x-increase" aria-label="Move image right"></button>
                  <button type="button" class="nudge-button down" data-offset-action="y-increase" aria-label="Move image down"></button>
                </div>
                <label class="inline-check lock-field" title="Prevents accidental mouse-wheel zoom, dragging, and nudge edits to the image calibration.">
                  <input id="lock-image" type="checkbox" checked />
                  Lock image
                </label>
              </div>
              <div class="overlay-control-row">
                <div class="rotation-buttons" id="rotation-preview" aria-label="Rotation preview">
                  <span class="muted">Preview</span>
                  <button type="button" data-preview-rotation="0">0</button>
                  <button type="button" data-preview-rotation="90">90</button>
                  <button type="button" data-preview-rotation="180">180</button>
                  <button type="button" data-preview-rotation="270">270</button>
                </div>
                <div class="tool-buttons" id="editor-tools">
                  <button type="button" data-mode="move_image" title="Drag the image under the grid. Ctrl+drag also works from any tool."><span class="tool-icon icon-move" aria-hidden="true"></span><span>Move Image</span></button>
                  <button type="button" data-mode="walkable_toggle" title="Click a square to toggle walkable/blocked."><span class="tool-icon icon-walkable" aria-hidden="true"></span><span>Walk/Block</span></button>
                  <button type="button" data-mode="half_cycle" title="Click a square repeatedly to cycle half-block masks."><span class="tool-icon icon-half half-ne" aria-hidden="true"></span><span>Half</span></button>
                  <button type="button" data-mode="slope_cycle" title="Click a square repeatedly to cycle shallow slope masks."><span class="tool-icon icon-slope slope-ne" aria-hidden="true"></span><span>Slope</span></button>
                  <button type="button" data-mode="long_slope_cycle" title="Click a square repeatedly to cycle vertical and horizontal long slope masks."><span class="tool-icon icon-long-slope long-slope-right" aria-hidden="true"></span><span>Long Slope</span></button>
                  <button type="button" data-mode="curve_cycle" title="Click a square repeatedly to cycle curved corner masks."><span class="tool-icon icon-curve curve-ne" aria-hidden="true"></span><span>Curve</span></button>
                  <button type="button" data-mode="passage"><span class="tool-icon icon-passage" aria-hidden="true"></span><span>Passage</span></button>
                  <button type="button" data-mode="door"><span class="tool-icon icon-door" aria-hidden="true"></span><span>Door</span></button>
                  <button type="button" data-mode="dungeon_exit"><span class="tool-icon icon-dungeon-exit" aria-hidden="true"></span><span>Dungeon Exit</span></button>
                </div>
              </div>
            </div>
          </div>
          <div class="tile-preview-wrap">
            <div id="editor-stage" class="element-editor-stage">
              <img id="tile-preview" alt="" class="tile-preview" />
              <div id="grid-overlay" class="grid-overlay"></div>
              <div id="exit-overlay" class="exit-overlay"></div>
            </div>
          </div>
        </div>

        <div class="panel-subsection">
          <div class="panel-heading">
            <h2>Exits</h2>
            <div class="panel-actions">
              <button id="add-exit" type="button" class="secondary">+ Add Exit</button>
              <button id="save-tiles" type="button">Save Metadata</button>
            </div>
          </div>
          <div id="exit-list" class="exit-list"></div>
        </div>
      </section>
    </main>

    <script src="/static/tile-editor.js?v=0.16.0"></script>
  </body>
</html>
