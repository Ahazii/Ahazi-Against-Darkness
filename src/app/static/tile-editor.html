<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Map Element Metadata Editor</title>
    <link rel="stylesheet" href="/static/styles.css?v=0.6.0" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Map Element Metadata Editor</h1>
        <p>Set element footprints, walkable squares, and edge exits.</p>
      </div>
      <a class="link-button" href="/">Game</a>
    </header>

    <main class="shell editor-shell">
      <section class="panel editor-browser">
        <div class="panel-heading">
          <h2>Map Elements</h2>
          <span id="editor-status" class="status">Loading</span>
        </div>
        <div id="tile-list" class="tile-list"></div>
      </section>

      <section class="panel editor-detail">
        <div class="panel-heading">
          <h2 id="tile-title">Select an element</h2>
          <button id="save-tiles" type="button">Save Metadata</button>
        </div>

        <div class="tile-editor-grid">
          <form id="tile-form" class="stack">
            <label>
              Name
              <input id="edit-name" type="text" />
            </label>
            <label>
              Type
              <select id="edit-type">
                <option value="unknown">Unknown</option>
                <option value="room">Room</option>
                <option value="corridor">Corridor</option>
              </select>
            </label>
            <div class="form-row">
              <label>
                Width in Squares
                <input id="edit-width" type="number" min="1" max="20" />
              </label>
              <label>
                Height in Squares
                <input id="edit-height" type="number" min="1" max="20" />
              </label>
            </div>
            <label>
              Description
              <textarea id="edit-description" rows="4"></textarea>
            </label>
            <label>
              Status
              <input id="edit-status" type="text" />
            </label>
          </form>
        </div>

        <div class="panel-subsection">
          <div class="panel-heading">
            <h2>Grid Overlay</h2>
            <div class="tool-buttons" id="editor-tools">
              <button type="button" data-mode="walkable">Walkable</button>
              <button type="button" data-mode="blocked">Blocked</button>
              <button type="button" data-mode="passage">Passage</button>
              <button type="button" data-mode="door">Door</button>
              <button type="button" data-mode="dungeon_exit">Dungeon Exit</button>
              <button type="button" data-mode="erase_exit">Erase</button>
            </div>
          </div>
          <div class="tile-preview-wrap">
            <div id="editor-stage" class="element-editor-stage">
              <img id="tile-preview" alt="" class="tile-preview" />
              <div id="grid-overlay" class="grid-overlay"></div>
              <div id="exit-overlay" class="exit-overlay"></div>
            </div>
          </div>
        </div>

        <div class="panel-subsection">
          <div class="panel-heading">
            <h2>Exits</h2>
          </div>
          <div id="exit-list" class="exit-list"></div>
        </div>
      </section>
    </main>

    <script src="/static/tile-editor.js?v=0.6.0"></script>
  </body>
</html>
