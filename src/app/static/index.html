<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ahazi Against Darkness</title>
    <link rel="stylesheet" href="/static/styles.css?v=0.15.0" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Ahazi Against Darkness</h1>
        <p>Character pool, party setup, and dungeon session engine</p>
      </div>
      <div id="api-status" class="status">Connecting</div>
    </header>

    <main class="shell">
      <section id="setup-panel" class="workspace">
        <div class="panel">
          <div class="panel-heading">
            <h2>Characters</h2>
            <span id="character-count" class="muted"></span>
          </div>
          <form id="character-form" class="form-grid">
            <input id="character-name" type="text" placeholder="Name" maxlength="60" required />
            <select id="character-class" required></select>
            <button type="submit">Create</button>
          </form>
          <div class="filter-bar" aria-label="Character filters and sorting">
            <label>
              Class
              <select id="character-filter-class"></select>
            </label>
            <label>
              Level
              <select id="character-filter-level"></select>
            </label>
            <label>
              Sort
              <select id="character-sort"></select>
            </label>
            <button id="character-sort-direction" type="button" class="secondary sort-toggle">Asc</button>
          </div>
          <div id="characters" class="list"></div>
        </div>

        <div class="panel">
          <div class="panel-heading">
            <h2>Party</h2>
            <span class="muted">Choose exactly 4</span>
          </div>
          <form id="party-form" class="stack">
            <input id="party-name" type="text" placeholder="Party name" maxlength="80" required />
            <div id="party-picks" class="pick-grid"></div>
            <div class="actions tight-actions">
              <button id="save-party" type="submit">Save Party</button>
              <button id="cancel-party-edit" type="button" class="secondary hidden">Cancel Edit</button>
            </div>
          </form>
          <div class="filter-bar" aria-label="Party filters and sorting">
            <label>
              Class
              <select id="party-filter-class"></select>
            </label>
            <label>
              Avg Level
              <select id="party-filter-level"></select>
            </label>
            <label>
              Sort
              <select id="party-sort"></select>
            </label>
            <button id="party-sort-direction" type="button" class="secondary sort-toggle">Asc</button>
          </div>
          <div id="parties" class="list"></div>
        </div>

        <div class="panel">
          <div class="panel-heading">
            <h2>Adventure</h2>
            <span class="muted">Random dungeon first</span>
          </div>
          <div class="stack">
            <select id="party-select"></select>
            <select id="adventure-select"></select>
            <button id="start-session" type="button">Start Session</button>
            <button id="resume-session" type="button" class="secondary hidden">Resume Current Game</button>
            <a class="link-button" href="/static/tile-editor.html">Map Element Editor</a>
          </div>
          <div id="adventures" class="list compact"></div>
          <div class="panel-subsection">
            <div class="panel-heading">
              <h2>Saved Games</h2>
              <span id="save-count" class="muted"></span>
            </div>
            <div id="saved-games" class="list compact"></div>
          </div>
        </div>
      </section>

      <section id="session-panel" class="session hidden">
        <div class="session-main">
          <div class="panel map-panel">
            <div class="panel-heading">
              <h2>Map</h2>
              <div class="panel-actions">
                <button id="show-setup" type="button" class="secondary">Home Screen</button>
                <span id="session-mode" class="status"></span>
              </div>
            </div>
            <div class="map-controls" aria-label="Map view controls">
              <button id="map-zoom-out" type="button" class="secondary">-</button>
              <span id="map-zoom-label" class="status">100%</span>
              <button id="map-zoom-in" type="button" class="secondary">+</button>
              <button id="map-zoom-reset" type="button" class="secondary">100%</button>
              <button id="map-center-current" type="button" class="secondary">Center</button>
              <div class="nudge-pad map-pan-pad" aria-label="Map pan controls">
                <button id="map-pan-up" type="button" class="nudge-button up" aria-label="Pan map up"></button>
                <button id="map-pan-left" type="button" class="nudge-button left" aria-label="Pan map left"></button>
                <span class="nudge-center" aria-hidden="true"></span>
                <button id="map-pan-right" type="button" class="nudge-button right" aria-label="Pan map right"></button>
                <button id="map-pan-down" type="button" class="nudge-button down" aria-label="Pan map down"></button>
              </div>
            </div>
            <div id="map" class="map"></div>
            <div id="tile-detail" class="tile-detail"></div>
            <div id="exit-actions" class="exit-actions"></div>
            <div class="actions">
              <button id="search" type="button">Search</button>
              <button id="combat-round" type="button">Combat Round</button>
              <button id="rest" type="button">Rest</button>
              <button id="save-session" type="button" class="secondary">Save Game</button>
            </div>
          </div>

          <div class="panel side-panel">
            <h2>Party Sheets</h2>
            <div id="party-state" class="list"></div>
            <div class="panel-heading log-heading">
              <h2>Log</h2>
              <div class="log-controls">
                <label class="inline-check"><input id="show-rolls" type="checkbox" checked /> Rolls</label>
                <label class="inline-check"><input id="show-math" type="checkbox" /> Math</label>
              </div>
            </div>
            <div id="session-log" class="log"></div>
          </div>
        </div>
      </section>
    </main>

    <script src="/static/app.js?v=0.15.0"></script>
  </body>
</html>
