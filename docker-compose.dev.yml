version: "3.8"

services:
  app:
    build:
      context: .
      args:
        APP_USER: appuser
        APP_UID: 10001
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATA_DIR: /data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./:/app
      - 4ad_data:/data
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  4ad_data:
