<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Adventure Session</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <section id="session-view" class="session">
      <header class="session-header">
        <h2>Adventure Session</h2>
      </header>

      <div class="session-grid">
        <div class="map-panel">
          <h3>Map</h3>
          <div id="tile-visual" class="tile-visual"></div>
          <div id="map-grid" class="map-grid"></div>
          <div id="room-description" class="card"></div>
          <div class="session-actions">
            <button id="explore-btn">Explore Next Tile</button>
            <button id="combat-btn">Resolve Combat Round</button>
            <button id="search-btn">Search Tile</button>
            <button id="treasure-btn">Open Treasure</button>
            <button id="reaction-btn">Check Reactions</button>
          </div>
        </div>
        <div class="info-panel">
          <h3>Room Details</h3>
          <div id="room-info" class="card"></div>
          <h3>Character Sheets</h3>
          <div id="party-info" class="card"></div>
          <h3>Implemented Tables</h3>
          <div id="tables-info" class="card"></div>
          <h3>Log</h3>
          <div id="log" class="log"></div>
        </div>
      </div>
    </section>

    <script src="/static/session.js"></script>
  </body>
</html>
