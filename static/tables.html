<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tables</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Implemented Tables</h1>
      <p class="subtitle">View table values and tile shapes</p>
    </header>

    <main class="layout">
      <section class="panel">
        <h2>Dungeon Tables</h2>
        <div id="tables-list" class="stack"></div>
      </section>

      <section class="panel">
        <h2>Tile Shapes</h2>
        <div id="tile-shapes" class="tile-shapes-grid"></div>
      </section>
    </main>

    <section class="panel editor-panel">
      <h2>Edit Tables (JSON)</h2>
      <p class="subtitle">Edit the JSON and click Save to persist in /data.</p>
      <div class="editor-grid">
        <div class="editor-block">
          <label for="tables-json">dungeon_tables.json</label>
          <textarea id="tables-json" rows="14"></textarea>
        </div>
        <div class="editor-block">
          <label for="tile-shapes-json">tile_shapes.json</label>
          <textarea id="tile-shapes-json" rows="14"></textarea>
        </div>
        <div class="editor-block">
          <label for="tile-table-json">tile_table.json</label>
          <textarea id="tile-table-json" rows="14"></textarea>
        </div>
      </div>
      <button id="save-tables">Save Tables</button>
      <div id="save-status" class="subtitle"></div>
    </section>

    <script src="/static/tables.js"></script>
  </body>
</html>
